services:
  # ----------------------------------------------------------------------------
  # SRE Ops Agent API Service
  # ----------------------------------------------------------------------------
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sre-ai-agent
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:1.5b
      - DOCS_DIR=/app/docs
      - SECURITY_ENABLED=true
      - AGENT_MAX_STEPS=6
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./docs:/app/docs:ro
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Local Ollama LLM Service (CPU mode, optimized for low RAM)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: sre-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2560M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
